[project]
name = "aurora-shell"
version = "0.1.0"
description = "An original modular desktop shell architecture for Hyprland on Arch Linux"
requires-python = ">=3.11"
authors = [{name = "Aurora Contributors"}]
license = {text = "MIT"}

[project.scripts]
aurora-shell = "aurora.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["aurora*"]
