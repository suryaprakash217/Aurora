# Aurora animation policy.
# These values define movement timing and easing so the desktop feels polished without becoming distracting.
# They exist to make transitions feel deliberate and to preserve responsiveness.

animations {
    # Enable animations globally. This makes the shell feel modern and coherent.
    enabled = true
    # The default animation speed. Balanced to feel smooth without slowing down interactions.
    bezier = myBezier, 0.2, 0.8, 0.2, 1
    # A quick fade-in style for obvious state changes like opening and closing windows.
    animation = windows, 1, 180ms, myBezier
    # A smooth slide motion for windows entering and leaving the workspace.
    animation = windowsOut, 1, 180ms, default, popin 80%
    # A gentle fade for workspace changes and overlays.
    animation = border, 1, 180ms, default
    # A short transition for border changes to avoid jarring focus shifts.
    animation = borderangle, 1, 180ms, default
    # A soft motion for workspace changes to preserve context.
    animation = fade, 1, 180ms, default
    # A subtle layout animation for window movement and reflow.
    animation = workspaces, 1, 180ms, default
}
