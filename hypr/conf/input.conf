# Aurora input configuration.
# These settings define keyboard, mouse, and touch behavior so the shell feels responsive and predictable.
# They exist to make common interactions fast without requiring unnecessary physical effort.

input {
    # The keyboard layout. This is kept simple to support a broad range of users.
    kb_layout = us
    # The keyboard variant. It remains default so the layout is familiar.
    kb_variant = 
    # The keyboard options. No special behavior is enabled by default.
    kb_options = 
    # The keyboard rules. Leave this empty unless a system-specific layout requires overrides.
    kb_rules = 
    # The keyboard repeat speed. Faster repetition helps rapid typing and navigation.
    repeat_rate = 40
    # The key repeat delay. A short delay makes typing feel natural and responsive.
    repeat_delay = 250
    # Mouse acceleration. A moderate setting keeps cursor movement predictable.
    accel_profile = flat
    # Pointer sensitivity. This is left neutral so users can tune it easily.
    sensitivity = 0
    # Natural scrolling is enabled for touchpads and mice to match common desktop expectations.
    natural_scroll = false
    # The default pointer focus mode. This keeps window focus behavior intuitive.
    follow_mouse = 1
    # Touchpad tap-to-click. It improves laptop usability without adding complexity.
    tap = true
    # Drag lock is enabled to reduce accidental cursor movement while dragging.
    drag_lock = true
}
