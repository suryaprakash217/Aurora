# Aurora gesture configuration.
# These settings support touchpad and touchscreen gestures for common window and workspace actions.
# They exist to make laptop and tablet usage feel fluid while preserving accessibility.

decorations {
    # A modest blur radius keeps the shell feeling airy without sacrificing performance.
    rounding = 12
}

# Swipe gestures are enabled for workspace switching and window navigation.
dgesture = 3, horizontal, workspace
# Swipe up or down to move between workspaces. This makes navigation feel natural on laptops and tablets.
dgesture = 4, vertical, workspace
# A swipe to the right cycles focus to the next window. This supports quick multitasking flows.
dgesture = 5, horizontal, changegroup
