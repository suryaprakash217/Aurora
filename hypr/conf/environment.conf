# Aurora environment variables.
# These variables define how applications inherit display and runtime settings.
# They exist so apps behave consistently under Wayland and Hyprland.

env = XCURSOR_SIZE,24
# The cursor size is set explicitly to keep theme consistency across apps.
env = XCURSOR_THEME,Bibata-Modern-Ice
# The cursor theme is set explicitly for a uniform pointing experience.
env = QT_QPA_PLATFORMTHEME,qt5ct
# Qt applications use the system theme integration layer for consistency.
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# The shell disables Qt window decorations to let Hyprland manage them more cleanly.
env = GDK_BACKEND,wayland
# GTK applications are forced to use Wayland for native behavior.
env = SDL_VIDEODRIVER,wayland
# SDL applications use Wayland for better compatibility.
env = MOZ_ENABLE_WAYLAND,1
# Firefox is enabled for Wayland rendering where supported.
