# Aurora Hyprland core variables.
# These values define the base behavior of the compositor and are intentionally
# kept in one place so they can be tuned without touching the rest of the config.

# Global Hyprland variables that affect rendering, layout, and general behavior.
# They exist to keep the shell responsive and predictable on modern hardware.
$mainBorderColor = rgba(7c9cffee)
$secondaryBorderColor = rgba(4fd1c5ee)
$inactiveBorderColor = rgba(4c566aee)
$surfaceColor = rgba(11131aee)
$panelColor = rgba(171a24ee)

# The main gap size between windows. Larger values create a calmer, more spacious layout.
gaps_in = 8
# The outer gap size around the entire workspace. This keeps floating windows from
# feeling cramped against the screen edges.
gaps_out = 12
# The default border size for window edges. It is kept modest to preserve clarity.
border_size = 2
# The corner rounding for windows. Rounded corners feel more modern and reduce visual harshness.
rounding = 12
# The default active border color. It provides a clear focus indicator for the active window.
col.active_border = $mainBorderColor
# The border color used for inactive windows. It keeps focus contrast low and calm.
col.inactive_border = $inactiveBorderColor
# The border color used for windows that are not the current focus target.
col.group_border = $secondaryBorderColor
# The border color for grouped windows. This helps visually relate related windows.
col.group_border_active = $mainBorderColor

# The general layout mode. "master" is used to keep the window arrangement predictable.
decorate = 1
# The default layout algorithm for tiling. It is chosen for a balanced, efficient desktop rhythm.
layout = master
# The number of workspaces visible in the overview. Keeps the desktop feeling organized.
workspace = 1, default:true
workspace = 2, default:true
workspace = 3, default:true
workspace = 4, default:true
workspace = 5, default:true
workspace = 6, default:true
workspace = 7, default:true
workspace = 8, default:true
workspace = 9, default:true
