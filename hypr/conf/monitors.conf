# Aurora monitor configuration.
# These settings define the layout of displays and the way the shell uses them.
# They exist to keep multi-monitor setups predictable and to support future dock and panel positioning.

# Use the current display order as the default. This keeps the machine usable even if a display
# is disconnected or re-ordered, which is ideal for portable laptops and docked setups.
monitor = eDP-1, preferred, auto, 1
monitor = HDMI-A-1, preferred, auto-right, 1
monitor = DP-1, preferred, auto-right, 1

# Example of a fixed layout for a laptop plus external display.
# The comments are intentionally explanatory so the file remains easy to edit.
# monitor = eDP-1, 1920x1080@60, 0x0, 1
# monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1
