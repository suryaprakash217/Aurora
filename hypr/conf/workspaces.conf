# Aurora workspace configuration.
# Workspaces define how virtual desktops are arranged and how they behave in everyday use.
# They exist so users can organize work into predictable, persistent spaces.

# The default workspace layout is a simple row of workspaces that are easy to navigate.
# The values below intentionally keep the behavior conventional and predictable.
workspace = 1, name:main
workspace = 2, name:code
workspace = 3, name:browser
workspace = 4, name:chat
workspace = 5, name:media
workspace = 6, name:utility
workspace = 7, name:files
workspace = 8, name:term
workspace = 9, name:extra
