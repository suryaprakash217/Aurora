# Aurora keybinding configuration.
# These bindings define the primary interaction model for the shell.
# They exist to make common actions fast, discoverable, and consistent.

$mainMod = SUPER

# Launch terminal with the main modifier and enter. This is a common and efficient workflow.
bind = $mainMod, RETURN, exec, alacritty
# Open the application launcher. This keeps the shell keyboard-driven and fast.
bind = $mainMod, SPACE, exec, fuzzel
# Toggle the floating window mode for the focused window. This is useful for temporary layouts.
bind = $mainMod SHIFT, F, togglefloating
# Maximize the active window. This creates a distraction-free focus state.
bind = $mainMod, M, fullscreen
# Kill the focused window. This is a quick way to close an application without reaching for the mouse.
bind = $mainMod SHIFT, Q, killactive
# Move focus between windows. This is one of the most common navigation actions.
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
# Move windows between positions. This supports manual arrangement and custom layouts.
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
# Switch workspaces. This provides fast navigation across the desktop.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
# Move focused window to another workspace. This supports task grouping.
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
# Reload the config. This helps iterate on the shell without restarting the session.
bind = $mainMod, R, exec, hyprctl reload
# Toggle the screenshot utility. This keeps common capture actions available from the keyboard.
bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f -
