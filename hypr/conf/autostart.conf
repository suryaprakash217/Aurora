# Aurora autostart configuration.
# These commands run when Hyprland starts and are kept intentionally lightweight.
# They exist to provide a clean session boot experience without overwhelming the system.

# Start a background daemon that can be extended later for notifications and session services.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Refresh the user environment when Wayland starts so the session is properly initialized.
exec-once = /usr/lib/polkit-kde-authentication-agent-1
# Authentication agent for privilege prompts. This keeps secure workflows available.
exec-once = waybar
# Start a status bar. The shell will later replace this with a more specialized Aurora panel.
exec-once = nm-applet --indicator
# Start the network applet so connectivity remains visible and manageable.
