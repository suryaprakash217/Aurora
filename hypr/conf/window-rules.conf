# Aurora window rules.
# These rules define how specific applications are laid out, floated, or decorated.
# They exist to make the desktop feel intentional without forcing every app into the same pattern.

# Terminal windows are kept in a predictable tiled layout.
windowrulev2 = tile, class:^(Alacritty)$
# File managers are floated by default to make browsing feel less cramped.
windowrulev2 = float, class:^(Thunar)$
# Browser windows are allowed to use more width and stay less intrusive.
windowrulev2 = maximize, class:^(firefox)$
# Dialog windows should float so they remain usable and unobtrusive.
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save As)$
