# Aurora Hyprland configuration entrypoint.
# This file intentionally keeps only the include directives and a small amount of
# high-level bootstrapping so the configuration remains modular and easy to maintain.

# Load the modular configuration fragments.
source = ~/.config/hypr/conf/variables.conf
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/animations.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/gestures.conf
source = ~/.config/hypr/conf/workspaces.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/window-rules.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/conf/environment.conf
